name: Build App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        type: choice
        default: both
        options:
          - both
          - ios
          - android
      tag:
        description: Release tag (blank = build-<run number>)
        type: string
        default: ""
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
      android_abis:
        description: Android ABIs to build (arm64-v8a covers phones since 2017; add armeabi-v7a for old 32-bit ones)
        type: string
        default: arm64-v8a

# Needed by the release job to create tags and upload assets.
permissions:
  contents: write

# Runs queue instead of pre-empting each other. These are release builds, not
# push CI: cancelling in progress throws away a half-hour Xcode archive the
# moment a second build is dispatched.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: apps/mobile

jobs:
  ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache CocoaPods downloads
        # op-sqlite and react-native-executorch pull large prebuilt xcframeworks;
        # caching the pod download cache saves several minutes per run.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Stamp release tag into the app
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || format('build-{0}', github.run_number) }}"
          cat > ${{ env.APP_DIR }}/src/lib/release.ts <<EOF
          // Stamped by the Build App workflow.
          export const RELEASE_TAG = '$TAG';
          export const RELEASE_COMMIT = '${{ github.sha }}';
          EOF
          cat ${{ env.APP_DIR }}/src/lib/release.ts

      - name: Generate iOS project (Expo Prebuild)
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform ios --clean

      - name: Cache Pods
        # pod install re-downloads and re-links everything otherwise; keyed on the JS lockfile
        # because Podfile.lock only exists after this step.
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/ios/Pods
          key: ${{ runner.os }}-Pods-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}

      - name: Install CocoaPods
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install

      - name: Resolve Xcode scheme
        id: scheme
        working-directory: ${{ env.APP_DIR }}
        # Expo names the workspace after the app name in app.config.ts
        # (engram -> engram.xcworkspace). Derive it so a rename doesn't break the build.
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"

      - name: Check the Swift rewrite (Expo factory + sideload hand-off) landed in the generated project
        # Before the archive: a bad rewrite fails here in seconds instead of half an hour in.
        working-directory: ${{ env.APP_DIR }}
        run: |
          node plugins/check.js
          SWIFT=$(ls ios/*ShareExtension/ShareExtensionViewController.swift)
          for m in "import Expo" "ExpoReactNativeFactory(delegate:" "ALTAppGroups" "func handOff(" "func finish(opening" "app.engram.share"; do
            grep -q -- "$m" "$SWIFT" || { echo "::error::share extension was not rewritten: missing '$m'"; exit 1; }
          done
          if grep -q "Could not find AppGroup in info.plist" "$SWIFT"; then echo "::error::an early-return group guard survived the rewrite"; exit 1; fi
          grep -q '<string>engram</string>' ios/*ShareExtension/Info.plist || { echo "::error::HostAppScheme is not the single 'engram' scheme"; exit 1; }
          echo "Extension build settings (deployment target must match the pods):"
          grep -n "IPHONEOS_DEPLOYMENT_TARGET\|PRODUCT_NAME = \"engramShareExtension\"" ios/*.xcodeproj/project.pbxproj

      - name: Build Unsigned Archive
        working-directory: ${{ env.APP_DIR }}
        # Full log kept for the failure artifact; the console only gets the tail plus every error line.
        run: |
          mkdir -p build
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -parallelizeTargets \
            archive > build/xcodebuild.log 2>&1 || { tail -n 200 build/xcodebuild.log; echo "---- error lines ----"; grep -n "error:" build/xcodebuild.log | head -n 100; exit 1; }
          tail -n 20 build/xcodebuild.log

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ env.APP_DIR }}/build/xcodebuild.log
          if-no-files-found: ignore

      - name: Check the share extension is embedded
        # The share sheet entry lives in PlugIns/<name>.appex. Exactly one: expo-share-intent is Android-only
        # (disableIOS) and expo-share-extension provides the iOS target. Its display name is the share-sheet label.
        working-directory: ${{ env.APP_DIR }}
        run: |
          APP=$(ls -d build/unsigned.xcarchive/Products/Applications/*.app | head -n 1)
          ls -la "$APP/PlugIns" || { echo "::error::No PlugIns/ in the app bundle — share extension missing"; exit 1; }
          N=$(ls -d "$APP"/PlugIns/*.appex 2>/dev/null | wc -l | tr -d ' ')
          [ "$N" = "1" ] || { echo "::error::Expected exactly one .appex in PlugIns/, found $N"; exit 1; }
          APPEX=$(ls -d "$APP"/PlugIns/*.appex)
          NAME=$(plutil -extract CFBundleDisplayName raw -o - "$APPEX/Info.plist")
          [ "$NAME" = "Save to engram" ] || { echo "::error::Share extension display name is '$NAME', expected 'Save to engram'"; exit 1; }
          [ -f "$APPEX/main.jsbundle" ] || { echo "::error::Share extension has no JS bundle (index.share.js was not bundled)"; exit 1; }
          echo "Activation rules:"
          plutil -p "$APPEX/Info.plist" | grep -A12 NSExtensionAttributes

      - name: Package into .ipa
        working-directory: ${{ env.APP_DIR }}
        run: |
          APP=$(ls -d build/unsigned.xcarchive/Products/Applications/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "$GITHUB_WORKSPACE/engram-ios-unsigned.ipa" Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engram-ios
          path: engram-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        # Dependency cache plus Gradle's build cache (task outputs), so unchanged modules are not recompiled.
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache native builds
        # CMake output for the C++ libraries (ExecuTorch, op-sqlite, Reanimated, worklets) is the bulk of the
        # build. It lives under node_modules/*/android/.cxx and the app's .cxx; keyed on the lockfile + ABIs.
        uses: actions/cache@v4
        with:
          path: |
            node_modules/**/android/.cxx
            node_modules/**/android/build
            apps/mobile/android/app/.cxx
          key: ${{ runner.os }}-cxx-${{ inputs.android_abis }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Free disk space
        # The runner starts with ~14 GB free; four ABIs of ExecuTorch, op-sqlite and
        # Reanimated plus Gradle caches exhaust that during packaging.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp release tag into the app
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || format('build-{0}', github.run_number) }}"
          cat > ${{ env.APP_DIR }}/src/lib/release.ts <<EOF
          // Stamped by the Build App workflow.
          export const RELEASE_TAG = '$TAG';
          export const RELEASE_COMMIT = '${{ github.sha }}';
          EOF
          cat ${{ env.APP_DIR }}/src/lib/release.ts

      - name: Generate Android project (Expo Prebuild)
        # Config plugins run here: the translucent ShareActivity, the OCR and
        # screenshot-watcher modules, op-sqlite with FTS5.
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --clean

      - name: Log node stderr from inside Gradle
        # Gradle's providers.exec swallows node's stderr; a shim on PATH tees it to a file.
        run: |
          mkdir -p /tmp/nodeshim
          REAL_NODE=$(which node)
          cat > /tmp/nodeshim/node <<EOF
          #!/usr/bin/env bash
          echo "--- node \$* (cwd \$PWD)" >> /tmp/node-stderr.log
          exec "$REAL_NODE" "\$@" 2> >(tee -a /tmp/node-stderr.log >&2)
          EOF
          chmod +x /tmp/nodeshim/node
          echo "/tmp/nodeshim" >> "$GITHUB_PATH"

      - name: Build Release APK
        # The Expo template signs the release build with the debug keystore, so
        # this needs no secrets. The APK is sideload-ready, not Play-Store-ready.
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          # The template's last line has no trailing newline; appending without one corrupts its value.
          printf '\norg.gradle.caching=true\n' >> gradle.properties
          ./gradlew assembleRelease --build-cache --stacktrace -PreactNativeArchitectures=${{ inputs.android_abis }}
          df -h /

      - name: Show node stderr captured during Gradle
        if: failure()
        run: cat /tmp/node-stderr.log 2>/dev/null || echo "(no node stderr captured)"

      - name: Collect APK
        run: cp ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk engram-android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engram-android
          path: engram-android.apk
          if-no-files-found: error
          retention-days: 14

  release:
    # Runs if at least one platform built. `always()` is required so that a
    # skipped platform (single-platform run) doesn't skip the release too.
    needs: [ios, android]
    if: ${{ always() && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: engram-*
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="build-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Everything since the previous release, grouped from the conventional commit messages.
          node scripts/changelog.mjs "$TAG" > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          - **Android:** download the `.apk` and open it. Signed with the debug keystore: fine for sideloading, not for the Play Store.
          - **iPhone:** the `.ipa` is unsigned. Install it with AltStore, SideStore or Sideloadly, which sign it with your Apple ID.

          Builds carry their own JavaScript bundle and need no Metro server.
          NOTES
          echo "" >> notes.md
          echo "Built from commit ${{ github.sha }}." >> notes.md
          echo "---- notes.md ----"; cat notes.md

      - name: Publish GitHub Release
        env:
          # Falls back to a PAT when the repo's built-in token is read-only.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ls -lh dist

          FLAGS=(--title "engram $TAG" --notes-file notes.md --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if ! gh release create "$TAG" "${FLAGS[@]}"; then
              echo "::error::Could not create release $TAG."
              echo "If the error above is HTTP 403 'Resource not accessible by integration',"
              echo "the workflow token is read-only. Fix it in either of these ways:"
              echo "  1. Settings -> Actions -> General -> Workflow permissions ->"
              echo "     select 'Read and write permissions' -> Save."
              echo "  2. Create a PAT with the 'contents' write scope and save it as"
              echo "     the repository secret RELEASE_TOKEN."
              exit 1
            fi
          fi

          # Assets carry the version: engram-1.7-android.apk, engram-1.7-ios-unsigned.ipa.
          for f in dist/engram-*; do mv "$f" "${f/engram-/engram-$TAG-}"; done
          ls dist
          gh release upload "$TAG" dist/* --clobber
          echo "Published $(gh release view "$TAG" --json url --jq .url)"
