name: Build App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        type: choice
        default: both
        options:
          - both
          - ios
          - android
      tag:
        description: Release tag (blank = build-<run number>)
        type: string
        default: ""
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
      android_abis:
        description: Android ABIs to build (arm64-v8a covers phones since 2017; add armeabi-v7a for old 32-bit ones)
        type: string
        default: arm64-v8a

# Needed by the release job to create tags and upload assets.
permissions:
  contents: write

# Runs queue instead of pre-empting each other. These are release builds, not
# push CI: cancelling in progress throws away a half-hour Xcode archive the
# moment a second build is dispatched.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: apps/mobile

jobs:
  ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache CocoaPods downloads
        # op-sqlite and react-native-executorch pull large prebuilt xcframeworks;
        # caching the pod download cache saves several minutes per run.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Generate iOS project (Expo Prebuild)
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform ios --clean

      - name: Cache Pods
        # pod install re-downloads and re-links everything otherwise; keyed on the JS lockfile
        # because Podfile.lock only exists after this step.
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/ios/Pods
          key: ${{ runner.os }}-Pods-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}

      - name: Install CocoaPods
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install

      - name: Cache ccache
        # React Native's Xcode build honours ccache; a warm cache roughly halves compile time.
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install ccache
        run: brew install ccache || true

      - name: Resolve Xcode scheme
        id: scheme
        working-directory: ${{ env.APP_DIR }}
        # Expo names the workspace after the app name in app.config.ts
        # (engram -> engram.xcworkspace). Derive it so a rename doesn't break the build.
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build Unsigned Archive
        working-directory: ${{ env.APP_DIR }}
        run: |
          export USE_CCACHE=1 CCACHE_DIR=~/Library/Caches/ccache
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -parallelizeTargets \
            -quiet \
            archive
          ccache -s || true

      - name: Check the share extension is embedded
        # The share sheet entry lives in PlugIns/<name>.appex. If the archive lacks it,
        # the IPA installs fine but engram never appears in the share sheet.
        working-directory: ${{ env.APP_DIR }}
        run: |
          APP=$(ls -d build/unsigned.xcarchive/Products/Applications/*.app | head -n 1)
          ls -la "$APP/PlugIns" || { echo "::error::No PlugIns/ in the app bundle — share extension missing"; exit 1; }
          ls "$APP"/PlugIns/*.appex >/dev/null 2>&1 || { echo "::error::No .appex in PlugIns/"; exit 1; }
          plutil -p "$APP"/PlugIns/*.appex/Info.plist | grep -A12 NSExtensionAttributes || true

      - name: Check the sideload app-group fallback is compiled in
        working-directory: ${{ env.APP_DIR }}
        run: |
          grep -l ALTAppGroups ios/*/ShareViewController.swift || { echo "::error::share extension still hard-codes the app group"; exit 1; }
          grep -q ALTAppGroups ../../node_modules/expo-share-intent/ios/ExpoShareIntentModule.swift || { echo "::error::expo-share-intent patch not applied"; exit 1; }

      - name: Package into .ipa
        working-directory: ${{ env.APP_DIR }}
        run: |
          APP=$(ls -d build/unsigned.xcarchive/Products/Applications/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "$GITHUB_WORKSPACE/engram-ios-unsigned.ipa" Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engram-ios
          path: engram-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        # Dependency cache plus Gradle's build cache (task outputs), so unchanged modules are not recompiled.
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache native builds
        # CMake output for the C++ libraries (ExecuTorch, op-sqlite, Reanimated, worklets) is the bulk of the
        # build. It lives under node_modules/*/android/.cxx and the app's .cxx; keyed on the lockfile + ABIs.
        uses: actions/cache@v4
        with:
          path: |
            node_modules/**/android/.cxx
            node_modules/**/android/build
            apps/mobile/android/app/.cxx
          key: ${{ runner.os }}-cxx-${{ inputs.android_abis }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Free disk space
        # The runner starts with ~14 GB free; four ABIs of ExecuTorch, op-sqlite and
        # Reanimated plus Gradle caches exhaust that during packaging.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project (Expo Prebuild)
        # Config plugins run here: the translucent ShareActivity, the OCR and
        # screenshot-watcher modules, op-sqlite with FTS5.
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK
        # The Expo template signs the release build with the debug keystore, so
        # this needs no secrets. The APK is sideload-ready, not Play-Store-ready.
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=${{ inputs.android_abis }}
          df -h /

      - name: Collect APK
        run: cp ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk engram-android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engram-android
          path: engram-android.apk
          if-no-files-found: error
          retention-days: 14

  release:
    # Runs if at least one platform built. `always()` is required so that a
    # skipped platform (single-platform run) doesn't skip the release too.
    needs: [ios, android]
    if: ${{ always() && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: engram-*
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="build-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          Automated build.

          - **Android** `.apk` is signed with the Expo debug keystore. Fine for
            sideloading, not accepted by the Play Store.
          - **iOS** `.ipa` is **unsigned**. Install it with a tool that re-signs on
            install (AltStore, Sideloadly), or resign it yourself. It will not
            install by double-clicking.

          These are plain release builds: they carry their own JavaScript bundle
          and do not need a Metro server.
          NOTES
          echo "" >> notes.md
          echo "Built from commit ${{ github.sha }}." >> notes.md

      - name: Publish GitHub Release
        env:
          # Falls back to a PAT when the repo's built-in token is read-only.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ls -lh dist

          FLAGS=(--title "engram $TAG" --notes-file notes.md --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if ! gh release create "$TAG" "${FLAGS[@]}"; then
              echo "::error::Could not create release $TAG."
              echo "If the error above is HTTP 403 'Resource not accessible by integration',"
              echo "the workflow token is read-only. Fix it in either of these ways:"
              echo "  1. Settings -> Actions -> General -> Workflow permissions ->"
              echo "     select 'Read and write permissions' -> Save."
              echo "  2. Create a PAT with the 'contents' write scope and save it as"
              echo "     the repository secret RELEASE_TOKEN."
              exit 1
            fi
          fi

          gh release upload "$TAG" dist/* --clobber
          echo "Published $(gh release view "$TAG" --json url --jq .url)"
