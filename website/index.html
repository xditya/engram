<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bundled Page</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #f4f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__bundler_loading {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #666;
        background: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        z-index: 10000;
      }
      #__bundler_thumbnail {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5f7;
        z-index: 9999;
      }
      #__bundler_thumbnail svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #__bundler_placeholder {
        color: #999;
        font-size: 14px;
      }
    </style>
    <noscript>
      <style>
        #__bundler_loading {
          display: none;
        }
      </style>
      <div
        style="
          position: fixed;
          bottom: 12px;
          left: 12px;
          font:
            13px/1.4 -apple-system,
            BlinkMacSystemFont,
            sans-serif;
          color: #999;
          background: rgba(255, 255, 255, 0.9);
          padding: 6px 12px;
          border-radius: 6px;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
          z-index: 10000;
        "
      >
        This page requires JavaScript to display.
      </div>
    </noscript>
  </head>
  <body>
    <div id="__bundler_thumbnail">
      <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        <rect width="1200" height="800" fill="#F4F5F7"></rect>
        <g transform="translate(420 220) scale(18)">
          <path
            d="M3.9 15L4.5 14.8L5.2 14.6L5.7 14.4L6.3 14.1L6.8 13.7L7.3 13.3L7.8 12.9L8.3 12.4L8.7 11.8L9.2 11.2L9.7 10.6L10.2 10L10.7 9.3L11.2 8.5L11.8 7.8L12.3 7L12.9 6.2L13.6 5.4L14.2 4.5L15 3.7A1.6 1.6 0 0 1 17.2 5.9L16.5 6.6L15.7 7.3L15 8L14.3 8.7L13.6 9.4L13 10L12.3 10.7L11.7 11.3L11.1 11.9L10.5 12.4L9.9 13L9.2 13.5L8.6 13.9L8 14.3L7.3 14.6L6.7 14.9L6 15.2L5.3 15.3L4.6 15.4L3.9 15.4A0.3 0.3 0 0 1 3.9 15Z"
            fill="#2E4FD6"
          ></path>
        </g>
        <text
          x="600"
          y="620"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="52"
          font-weight="600"
          fill="#15171A"
        >
          engram
        </text>
      </svg>
    </div>
    <div id="__bundler_loading">Unpacking...</div>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME =
          /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + 0x8000),
            );
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                "[bundle] resource failed to load:",
                e.target.tagName,
                String(e.target.src || e.target.href || ""),
              );
              return;
            }
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector(
            'script[type="__bundler/page_order"]',
          );
          const pageOrder = pageOrderEl
            ? JSON.parse(pageOrderEl.textContent)
            : [];
          const pageSet = new Set(pageOrder);
          const pageTexts = {};

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || "")
            ? window.origin
            : "*";
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true; // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === "null" &&
                (window.origin === "file://" ||
                  window.location.protocol === "file:")) ||
              (/^file:/.test(e.origin) && window.origin === "null")
            );
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0;
          const blobUrls = {};
          const resourceBlobs = {};
          const UUID_SHAPE =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: "text/html" });
            const u = URL.createObjectURL(pageBlob);
            resourceBlobs[u] = pageBlob;
            el.src = u + frag;
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid];
            delete pendingFrames[uuid];
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
            const relays = pendingRelays[uuid];
            delete pendingRelays[uuid];
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = [];
            for (const f of Array.from(document.querySelectorAll("iframe"))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow);
              } catch (err) {
                /* detached */
              }
            }
            return out;
          }
          window.addEventListener("message", function (e) {
            const d = e.data;
            if (!d || typeof d !== "object" || !e.source) return;
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return;
            if (
              typeof d.__bundler_need === "string" &&
              UUID_SHAPE.test(d.__bundler_need)
            ) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return;
              const uuid = d.__bundler_need;
              const text = pageTexts[uuid];
              if (typeof text === "string") {
                try {
                  e.source.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
                return;
              }
              if (isPageRoot || window.parent === window) return; // authoritative miss
              const waiting = pendingRelays[uuid];
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
                return;
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return;
              pendingRelays[uuid] = [e.source];
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            } else if (
              typeof d.__bundler_page === "string" &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === "string"
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window)
                return;
              if (
                !(d.__bundler_page in pendingFrames) &&
                !(d.__bundler_page in pendingRelays)
              )
                return;
              deliverPage(d.__bundler_page, d.__bundler_text);
            }
          });

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    "data:" +
                    entry.mime +
                    ";base64," +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime });
                  blobUrls[uuid] = URL.createObjectURL(blob);
                  resourceBlobs[blobUrls[uuid]] = blob;
                }
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                const blob = new Blob([], { type: entry.mime });
                blobUrls[uuid] = URL.createObjectURL(blob);
                resourceBlobs[blobUrls[uuid]] = blob;
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs;

          setStatus("Rendering...");
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue;
            template = template.split(uuid).join(blobUrls[uuid]);
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap).replace(/<\//g, "<\\/") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll("iframe"))) {
              const m = MARKER.exec(el.getAttribute("src") || "");
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === "string") {
                mountPage(el, m[2] || "", text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({
                  el: el,
                  frag: m[2] || "",
                });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const pre = resourceBlobs[s.src.split("#")[0]];
              s.textContent = pre
                ? await pre.text()
                : await (await fetch(s.src)).text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });

\" style-active=\"{ transform: 'scale(0.97)' }\">Download<\u002Fa>\n        <a href=\"https://github.com/xditya/engram\" style=\"font-size: 15px; font-weight: 500; color: #15171A; border-bottom: 1px solid #DDE0E5; padding-bottom: 2px; transition: border-color 160ms ease\" style-hover=\"{ borderBottomColor: '#2E4FD6' }\">Read the source →<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; color: #666D75; margin: 20px 0 0; animation: heroIn 600ms cubic-bezier(0.23, 1, 0.32, 1) 240ms both\">Android &amp; iOS. No account. AGPL-3.0.<\u002Fp>\n    <\u002Fdiv>\n    <sc-if value=\"{{ saveLoop }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"Save demo\" style=\"animation: heroIn 700ms cubic-bezier(0.23, 1, 0.32, 1) 200ms both\">\n        <div style=\"background: #ECEEF1; border: 1px solid #DDE0E5; border-radius: 20px; height: 360px; position: relative; overflow: hidden\">\n          <p style=\"position: absolute; top: 18px; left: 22px; font-family: 'Geist Mono', monospace; font-size: 12px; color: #666D75; margin: 0\">share → engram<\u002Fp>\n          <div style=\"position: absolute; top: 50%; left: 50%; width: 300px; margin: -62px 0 0 -150px; animation: cardLoop 5.2s cubic-bezier(0.77, 0, 0.175, 1) infinite\">\n            <div style=\"background: #FFFFFF; border: 1px solid #DDE0E5; border-radius: 16px; padding: 18px 20px; animation: cardContentLoop 5.2s ease infinite\">\n              <div style=\"display: flex; align-items: center; gap: 8px\">\n                <svg xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"16\" height=\"16\" style=\"color: #666D75; flex-shrink: 0\"><path d=\"M8.25 13.5H6.75a3.5 3.5 0 0 1 0-7h1.5M11.75 6.5h1.5a3.5 3.5 0 0 1 0 7h-1.5M7.5 10h5\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Why we sleep in cycles<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: #666D75; margin: 8px 0 0 24px\">article · theguardian.com<\u002Fp>\n              <div style=\"display: flex; gap: 6px; margin: 14px 0 0 24px\">\n                <span style=\"font-size: 12px; color: #5C6370; background: #ECEEF1; border-radius: 6px; padding: 3px 9px\">sleep<\u002Fspan>\n                <span style=\"font-size: 12px; color: #5C6370; background: #ECEEF1; border-radius: 6px; padding: 3px 9px\">longread<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <svg xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" width=\"44\" height=\"44\" style=\"color: #2E4FD6; position: absolute; top: 50%; left: 50%; margin: -22px 0 0 -22px; animation: glyphLoop 5.2s cubic-bezier(0.23, 1, 0.32, 1) infinite\"><path d=\"M3.9 15L4.5 14.8L5.2 14.6L5.7 14.4L6.3 14.1L6.8 13.7L7.3 13.3L7.8 12.9L8.3 12.4L8.7 11.8L9.2 11.2L9.7 10.6L10.2 10L10.7 9.3L11.2 8.5L11.8 7.8L12.3 7L12.9 6.2L13.6 5.4L14.2 4.5L15 3.7A1.6 1.6 0 0 1 17.2 5.9L16.5 6.6L15.7 7.3L15 8L14.3 8.7L13.6 9.4L13 10L12.3 10.7L11.7 11.3L11.1 11.9L10.5 12.4L9.9 13L9.2 13.5L8.6 13.9L8 14.3L7.3 14.6L6.7 14.9L6 15.2L5.3 15.3L4.6 15.4L3.9 15.4A0.3 0.3 0 0 1 3.9 15Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n          <p style=\"position: absolute; top: 50%; left: 50%; margin: 34px 0 0 -22px; font-family: 'Geist Mono', monospace; font-size: 12px; color: #666D75; animation: savedLoop 5.2s cubic-bezier(0.23, 1, 0.32, 1) infinite\">saved<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: #666D75; margin: 12px 0 0 4px\">the save — a memory leaves a trace<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <main data-screen-label=\"What it does\" style=\"max-width: 1216px; margin: 0 auto; padding: 140px 48px 0\">\n    <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: 88px 1fr 400px; gap: 56px; padding: 64px 0; border-top: 1px solid #DDE0E5; align-items: center\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #666D75\">01<\u002Fspan>\n      <div>\n        <h2 style=\"font-size: 34px; font-weight: 600; letter-spacing: -0.025em; margin: 0\">save from anywhere<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #5C6370; max-width: 460px; margin: 16px 0 0; text-wrap: pretty\">Share a link, image or text from any app and a small sheet appears over the app you came from. The card folds into the trace mark, you see “Saved”, and you can add tags or put it in a Space without leaving what you were doing.<\u002Fp>\n      <\u002Fdiv>\n      <img src=\"f164416f-44c5-4ee9-9339-1c042747d6a6\" alt=\"Share overlay over Chrome\" style=\"width: 280px; border-radius: 20px; border: 1px solid #DDE0E5; display: block; justify-self: center\">\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: 88px 1fr 400px; gap: 56px; padding: 64px 0; border-top: 1px solid #DDE0E5; align-items: center\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #666D75\">02<\u002Fspan>\n      <div>\n        <h2 style=\"font-size: 34px; font-weight: 600; letter-spacing: -0.025em; margin: 0\">tags without a model<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #5C6370; max-width: 460px; margin: 16px 0 0; text-wrap: pretty\">Every save gets tags on its own: proper nouns and repeated terms from the page, text read out of images, the site it came from. Turn on Intelligence and the model you chose adds richer tags, a summary and semantic search — its tags look and behave like your own.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-content: center; justify-self: center; max-width: 300px\">\n        <span style=\"font-size: 13px; color: #5C6370; background: #FFFFFF; border: 1px solid #DDE0E5; border-radius: 6px; padding: 5px 12px\">dr. walker<\u002Fspan>\n        <span style=\"font-size: 13px; color: #5C6370; background: #FFFFFF; border: 1px solid #DDE0E5; border-radius: 6px; padding: 5px 12px\">rem cycles<\u002Fspan>\n        <span style=\"font-size: 13px; color: #5C6370; background: #FFFFFF; border: 1px solid #DDE0E5; border-radius: 6px; padding: 5px 12px\">theguardian.com<\u002Fspan>\n        <span style=\"font-size: 13px; color: #5C6370; background: #FFFFFF; border: 1px solid #DDE0E5; border-radius: 6px; padding: 5px 12px\">sleep<\u002Fspan>\n        <span style=\"font-size: 13px; color: #2E4FD6; background: #2E4FD61A; border: 1px solid transparent; border-radius: 6px; padding: 5px 12px\">+ summary<\u002Fspan>\n        <span style=\"font-size: 13px; color: #2E4FD6; background: #2E4FD61A; border: 1px solid transparent; border-radius: 6px; padding: 5px 12px\">+ semantic search<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: 88px 1fr 400px; gap: 56px; padding: 64px 0; border-top: 1px solid #DDE0E5; align-items: center\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #666D75\">03<\u002Fspan>\n      <div>\n        <h2 style=\"font-size: 34px; font-weight: 600; letter-spacing: -0.025em; margin: 0\">search that reads the whole page<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #5C6370; max-width: 460px; margin: 16px 0 0; text-wrap: pretty\">Articles are saved with their full text and indexed, so a search finds the word inside the piece, not only in the title. Operators narrow things down; press Enter to turn a term into a chip and keep typing. A search you want to keep becomes a Space.<\u002Fp>\n        <p style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #666D75; margin: 20px 0 0\">tag: &nbsp;type: &nbsp;site: &nbsp;text: &nbsp;before: &nbsp;after: &nbsp;“phrase” &nbsp;-not<\u002Fp>\n      <\u002Fdiv>\n      <img src=\"4f7641fc-cdfa-4762-92f0-5ea3ca2a59e8\" alt=\"Search\" style=\"width: 280px; border-radius: 20px; border: 1px solid #DDE0E5; display: block; justify-self: center\">\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: 88px 1fr 400px; gap: 56px; padding: 64px 0; border-top: 1px solid #DDE0E5; align-items: center\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #666D75\">04<\u002Fspan>\n      <div>\n        <h2 style=\"font-size: 34px; font-weight: 600; letter-spacing: -0.025em; margin: 0\">resurface<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #5C6370; max-width: 460px; margin: 16px 0 0; text-wrap: pretty\">Cards you have not opened in a while come back a few at a time. Strengthen the ones that still matter, let go of the rest. Letting go keeps a card for 30 days, and Undo is one tap away.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 22px; justify-self: center; align-items: center\">\n        <svg xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" width=\"34\" height=\"34\" style=\"color: #15171A; opacity: 0.25\"><path d=\"M3.9 15L4.5 14.8L5.2 14.6L5.7 14.4L6.3 14.1L6.8 13.7L7.3 13.3L7.8 12.9L8.3 12.4L8.7 11.8L9.2 11.2L9.7 10.6L10.2 10L10.7 9.3L11.2 8.5L11.8 7.8L12.3 7L12.9 6.2L13.6 5.4L14.2 4.5L15 3.7A1.6 1.6 0 0 1 17.2 5.9L16.5 6.6L15.7 7.3L15 8L14.3 8.7L13.6 9.4L13 10L12.3 10.7L11.7 11.3L11.1 11.9L10.5 12.4L9.9 13L9.2 13.5L8.6 13.9L8 14.3L7.3 14.6L6.7 14.9L6 15.2L5.3 15.3L4.6 15.4L3.9 15.4A0.3 0.3 0 0 1 3.9 15Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n        <svg xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" width=\"34\" height=\"34\" style=\"color: #15171A; opacity: 0.42\"><path d=\"M3.9 15L4.5 14.8L5.2 14.6L5.7 14.4L6.3 14.1L6.8 13.7L7.3 13.3L7.8 12.9L8.3 12.4L8.7 11.8L9.2 11.2L9.7 10.6L10.2 10L10.7 9.3L11.2 8.5L11.8 7.8L12.3 7L12.9 6.2L13.6 5.4L14.2 4.5L15 3.7A1.6 1.6 0 0 1 17.2 5.9L16.5 6.6L15.7 7.3L15 8L14.3 8.7L13.6 9.4L13 10L12.3 10.7L11.7 11.3L11.1 11.9L10.5 12.4L9.9 13L9.2 13.5L8.6 13.9L8 14.3L7.3 14.6L6.7 14.9L6 15.2L5.3 15.3L4.6 15.4L3.9 15.4A0.3 0.3 0 0 1 3.9 15Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n        <svg xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" width=\"34\" height=\"34\" style=\"color: #15171A; opacity: 0.6\"><path d=\"M3.9 15L4.5 14.8L5.2 14.6L5.7 14.4L6.3 14.1L6.8 13.7L7.3 13.3L7.8 12.9L8.3 12.4L8.7 11.8L9.2 11.2L9.7 10.6L10.2 10L10.7 9.3L11.2 8.5L11.8 7.8L12.3 7L12.9 6.2L13.6 5.4L14.2 4.5L15 3.7A1.6 1.6 0 0 1 17.2 5.9L16.5 6.6L15.7 7.3L15 8L14.3 8.7L13.6 9.4L13 10L12.3 10.7L11.7 11.3L11.1 11.9L10.5 12.4L9.9 13L9.2 13.5L8.6 13.9L8 14.3L7.3 14.6L6.7 14.9L6 15.2L5.3 15.3L4.6 15.4L3.9 15.4A0.3 0.3 0 0 1 3.9 15Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n        <svg xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" width=\"34\" height=\"34\" style=\"color: #15171A; opacity: 0.8\"><path d=\"M3.9 15L4.5 14.8L5.2 14.6L5.7 14.4L6.3 14.1L6.8 13.7L7.3 13.3L7.8 12.9L8.3 12.4L8.7 11.8L9.2 11.2L9.7 10.6L10.2 10L10.7 9.3L11.2 8.5L11.8 7.8L12.3 7L12.9 6.2L13.6 5.4L14.2 4.5L15 3.7A1.6 1.6 0 0 1 17.2 5.9L16.5 6.6L15.7 7.3L15 8L14.3 8.7L13.6 9.4L13 10L12.3 10.7L11.7 11.3L11.1 11.9L10.5 12.4L9.9 13L9.2 13.5L8.6 13.9L8 14.3L7.3 14.6L6.7 14.9L6 15.2L5.3 15.3L4.6 15.4L3.9 15.4A0.3 0.3 0 0 1 3.9 15Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n        <svg xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" width=\"34\" height=\"34\" style=\"color: #2E4FD6\"><path d=\"M3.9 15L4.5 14.8L5.2 14.6L5.7 14.4L6.3 14.1L6.8 13.7L7.3 13.3L7.8 12.9L8.3 12.4L8.7 11.8L9.2 11.2L9.7 10.6L10.2 10L10.7 9.3L11.2 8.5L11.8 7.8L12.3 7L12.9 6.2L13.6 5.4L14.2 4.5L15 3.7A1.6 1.6 0 0 1 17.2 5.9L16.5 6.6L15.7 7.3L15 8L14.3 8.7L13.6 9.4L13 10L12.3 10.7L11.7 11.3L11.1 11.9L10.5 12.4L9.9 13L9.2 13.5L8.6 13.9L8 14.3L7.3 14.6L6.7 14.9L6 15.2L5.3 15.3L4.6 15.4L3.9 15.4A0.3 0.3 0 0 1 3.9 15Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: 88px 1fr 400px; gap: 56px; padding: 64px 0; border-top: 1px solid #DDE0E5; align-items: center\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #666D75\">05<\u002Fspan>\n      <div>\n        <h2 style=\"font-size: 34px; font-weight: 600; letter-spacing: -0.025em; margin: 0\">sync through storage you already own<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #5C6370; max-width: 460px; margin: 16px 0 0; text-wrap: pretty\">Link a second phone by scanning a code and your library syncs through your Google Drive, iCloud Drive, or any WebDAV server. Everything is encrypted before it leaves the device, with a key only you hold — written down as 12 words. The provider sees file sizes and timestamps, nothing else.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #5C6370; justify-self: center; display: grid; gap: 10px\">\n        <span>google drive<\u002Fspan>\n        <span>icloud drive<\u002Fspan>\n        <span>any webdav server<\u002Fspan>\n        <span style=\"color: #666D75\">→ encrypted first, always<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: 88px 1fr 400px; gap: 56px; padding: 64px 0; border-top: 1px solid #DDE0E5; border-bottom: 1px solid #DDE0E5; align-items: center\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #666D75\">06<\u002Fspan>\n      <div>\n        <h2 style=\"font-size: 34px; font-weight: 600; letter-spacing: -0.025em; margin: 0\">leave whenever you like<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #5C6370; max-width: 460px; margin: 16px 0 0; text-wrap: pretty\">Export is a zip with your original files, JSON, a CSV with every tag and summary, and markdown notes you can drop into Obsidian. Import takes a mymind export, Raindrop and Pocket CSVs, browser bookmarks, and markdown folders.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Geist Mono', monospace; font-size: 13px; line-height: 2; color: #5C6370; justify-self: center\">\n        <div>engram-export.zip<\u002Fdiv>\n        <div>├─ files/ <span style=\"color: #666D75\">&nbsp;your originals<\u002Fspan><\u002Fdiv>\n        <div>├─ items.json<\u002Fdiv>\n        <div>├─ library.csv <span style=\"color: #666D75\">&nbsp;every tag &amp; summary<\u002Fspan><\u002Fdiv>\n        <div>└─ notes/*.md <span style=\"color: #666D75\">&nbsp;→ Obsidian<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <section data-screen-label=\"Own everything\" style=\"background: #0F1114; color: #EDEFF2; margin-top: 140px\">\n    <div style=\"max-width: 1216px; margin: 0 auto; padding: 112px 48px\">\n      <p style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #7B96FF; margin: 0\">own everything<\u002Fp>\n      <div data-reveal=\"1\" style=\"display: grid; gap: 0; margin-top: 40px\">\n        <p style=\"font-size: 42px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin: 0; padding: 28px 0; border-top: 1px solid #272A30; text-wrap: balance\">No account. No server of ours anywhere in the picture.<\u002Fp>\n        <p style=\"font-size: 42px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin: 0; padding: 28px 0; border-top: 1px solid #272A30; text-wrap: balance\">A SQLite database on your device. <span style=\"color: #828996\">Export it any time.<\u002Fspan><\u002Fp>\n        <p style=\"font-size: 42px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin: 0; padding: 28px 0; border-top: 1px solid #272A30; text-wrap: balance\">The AI is yours to choose. <span style=\"color: #828996\">Your key, your machine, or the phone itself.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 48px\">\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #A3A9B3; border: 1px solid #272A30; border-radius: 6px; padding: 6px 12px\">anthropic<\u002Fspan>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #A3A9B3; border: 1px solid #272A30; border-radius: 6px; padding: 6px 12px\">openai<\u002Fspan>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #A3A9B3; border: 1px solid #272A30; border-radius: 6px; padding: 6px 12px\">gemini<\u002Fspan>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #A3A9B3; border: 1px solid #272A30; border-radius: 6px; padding: 6px 12px\">openrouter<\u002Fspan>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #A3A9B3; border: 1px solid #272A30; border-radius: 6px; padding: 6px 12px\">ollama<\u002Fspan>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #A3A9B3; border: 1px solid #272A30; border-radius: 6px; padding: 6px 12px\">lm studio<\u002Fspan>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #7B96FF; border: 1px solid #272A30; border-radius: 6px; padding: 6px 12px\">on-device<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showInstall }}\" hint-placeholder-val=\"{{ true }}\">\n    <section data-screen-label=\"Install\" style=\"max-width: 1216px; margin: 0 auto; padding: 120px 48px 0; display: grid; grid-template-columns: 88px 1fr 1fr; gap: 56px\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #666D75; padding-top: 6px\">07<\u002Fspan>\n      <div>\n        <h2 style=\"font-size: 34px; font-weight: 600; letter-spacing: -0.025em; margin: 0\">install it, or build it<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #5C6370; max-width: 420px; margin: 16px 0 0; text-wrap: pretty\">Builds are on the <a href=\"https://github.com/xditya/engram/releases\" style=\"color: #15171A; border-bottom: 1px solid #DDE0E5\">releases<\u002Fa> page. The Android APK sideloads directly; the iOS build installs with a tool that signs on install, such as AltStore or Sideloadly.<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #5C6370; max-width: 420px; margin: 14px 0 0; text-wrap: pretty\">Or clone it — Node 22, pnpm 9, and the Android SDK or Xcode.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Geist Mono', monospace; font-size: 13.5px; line-height: 2.1; color: #5C6370; background: #FFFFFF; border: 1px solid #DDE0E5; border-radius: 16px; padding: 24px 28px; align-self: start\">\n        <div><span style=\"color: #666D75\">$<\u002Fspan> pnpm install<\u002Fdiv>\n        <div><span style=\"color: #666D75\">$<\u002Fspan> pnpm test <span style=\"color: #666D75\"># incl. sync fuzz<\u002Fspan><\u002Fdiv>\n        <div><span style=\"color: #666D75\">$<\u002Fspan> pnpm android<\u002Fdiv>\n        <div><span style=\"color: #666D75\">$<\u002Fspan> pnpm ios <span style=\"color: #666D75\"># on a mac<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer data-screen-label=\"Footer\" style=\"max-width: 1216px; margin: 120px auto 0; padding: 28px 48px 40px; border-top: 1px solid #DDE0E5; display: flex; align-items: center; justify-content: space-between\">\n    <div style=\"display: flex; align-items: center; gap: 8px; color: #666D75; font-size: 13px\">\n      <svg xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" width=\"16\" height=\"16\" style=\"color: #666D75; opacity: 0.5\"><path d=\"M3.9 15L4.5 14.8L5.2 14.6L5.7 14.4L6.3 14.1L6.8 13.7L7.3 13.3L7.8 12.9L8.3 12.4L8.7 11.8L9.2 11.2L9.7 10.6L10.2 10L10.7 9.3L11.2 8.5L11.8 7.8L12.3 7L12.9 6.2L13.6 5.4L14.2 4.5L15 3.7A1.6 1.6 0 0 1 17.2 5.9L16.5 6.6L15.7 7.3L15 8L14.3 8.7L13.6 9.4L13 10L12.3 10.7L11.7 11.3L11.1 11.9L10.5 12.4L9.9 13L9.2 13.5L8.6 13.9L8 14.3L7.3 14.6L6.7 14.9L6 15.2L5.3 15.3L4.6 15.4L3.9 15.4A0.3 0.3 0 0 1 3.9 15Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n      <span>made by <a href=\"https://xditya.me\" style=\"color: #5C6370; border-bottom: 1px solid #DDE0E5\">Aditya S<\u002Fa> &nbsp;·&nbsp; AGPL-3.0<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 24px; font-size: 13px\">\n      <a href=\"https://github.com/xditya/engram\" style=\"color: #5C6370\">github<\u002Fa>\n      <a href=\"https://buymeacoffee.com/xditya\" style=\"color: #5C6370\">buy me a coffee<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;saveLoop&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Hero&quot;}, &quot;showInstall&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      saveLoop: this.props.saveLoop ?? true,\n      showInstall: this.props.showInstall ?? true,\n    };\n  }\n  componentDidMount() {\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    if (reduce || !('IntersectionObserver' in window)) return;\n    const show = (el) => {\n      el.style.transition = 'opacity 600ms cubic-bezier(0.23,1,0.32,1), transform 600ms cubic-bezier(0.23,1,0.32,1)';\n      el.style.opacity = '1';\n      el.style.transform = 'translateY(0)';\n    };\n    els.forEach((el) => {\n      if (el.getBoundingClientRect().top < window.innerHeight * 0.9) return;\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(16px)';\n    });\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });\n    }, { rootMargin: '-60px' });\n    els.forEach((el) => io.observe(el));\n    setTimeout(() => els.forEach(show), 4000);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
  </body>
